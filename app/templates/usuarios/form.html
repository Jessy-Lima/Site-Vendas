<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "Editar" if editando else "Novo" }} Usuário</title>

    <link rel="stylesheet" href="/static/css/form_usuario.css">
</head>
<body>

<div class="container">

    <div class="card">

        <h1>
            {{ "Editar Usuário" if editando else "Novo Usuário" }}
        </h1>

        {% if erro %}
            <div class="erro">
                {{ erro }}
            </div>
        {% endif %}

        <form
            action="{{ '/usuarios/' + editando.id|string + '/editar' if editando else '/usuarios/novo' }}"
            method="post">

            <div class="campo">

                <label>Nome</label>

                <input
                    type="text"
                    name="nome"
                    value="{{ editando.nome if editando else (valores.nome if valores else '') }}"
                    required>

            </div>

            <div class="campo">

                <label>E-mail</label>

                <input
                    type="email"
                    name="email"
                    value="{{ editando.email if editando else (valores.email if valores else '') }}"
                    required>

            </div>

            <div class="campo">

                <label>Senha</label>

                <input
                    type="password"
                    name="senha"
                    {% if editando %}
                        placeholder="Deixe vazio para manter a senha atual"
                    {% else %}
                        required minlength="6"
                    {% endif %}>

            </div>

            <div class="campo">

                <label>Perfil</label>

                <select name="role">

                    <option
                        value="operador"
                        {{ 'selected' if (editando and editando.role == 'operador') or (valores and valores.role == 'operador') else '' }}>
                        Operador
                    </option>

                    <option
                        value="admin"
                        {{ 'selected' if (editando and editando.role == 'admin') or (valores and valores.role == 'admin') else '' }}>
                        Administrador
                    </option>

                </select>

            </div>

            <div class="botoes">

                <button type="submit" class="salvar">
                    {{ "Salvar Alterações" if editando else "Criar Usuário" }}
                </button>

                <a href="/usuarios" class="cancelar">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
